# Gradle JVM Heap tuned for GitHub Actions runners (Max 4GB)
org.gradle.jvmargs=-Xms1g -Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xms1g -Xmx2g -XX:+UseParallelGC

# Disable automatic toolchain downloads (prevents api.foojay.io calls)
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true

# Gradle Build Optimization
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin & KMP Settings
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2

# Android Settings
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# App Versioning
llamatik.version.major=1
llamatik.version.minor=9
llamatik.version.patch=0
